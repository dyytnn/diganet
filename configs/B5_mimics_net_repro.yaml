# B5: faithful MiMics-Net reimplementation on the MAT-BLAST benchmark.
# Adaptation from the paper: use our frozen 249-image/199-50 split so B3-B5
# are directly comparable; retain the paper's 400x400 network input.
seed: 0
allow_random_split: false
run_dir: runs/B5_mimics_net_repro
data:
  image_dir: dataset/source/images
  mask_root: dataset/source/masks
  split_json: data/splits/source_nested.json
  image_size: 400
  num_classes: 5
  in_channels: 1
  mask_classes: [zp, te, bl, icm]
  augmentation: mimics
  augmentation_repeats: 16
model:
  name: mimics_net
  in_channels: 1
  num_classes: 5
  base_channels: 24
  groups: 4
  gabor_kernel_size: 9
  gabor_sigma: 2.0
  gabor_wavelength: 5.0
  gabor_gamma: 0.5
loss:
  name: mimics_generalized_dice
training:
  epochs: 2000
  # The paper does not report mini-batch size; 4 fits the 400x400 reproduction.
  batch_size: 4
  num_workers: 2
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0005
  lr_policy: constant
  patience: 2000
  monitor: mdice_fg
  monitor_mode: max
