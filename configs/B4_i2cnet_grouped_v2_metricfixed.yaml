# B4-v2: metric-correct grouped-split restart of the I2CNet reproduction.
# Architecture, paper CE loss, paper augmentation, optimiser, and update
# budget follow B4_i2cnet_repro; only the common split/run protocol changes.
seed: 0
allow_random_split: false
run_dir: runs/B4_i2cnet_grouped_v2_metricfixed
data:
  image_dir: dataset/source/images
  mask_root: dataset/source/masks
  split_json: data/splits/source_grouped_v1.json
  image_size: 256
  num_classes: 5
  in_channels: 1
  mask_classes: [zp, te, bl, icm]
  augmentation: paper
model:
  name: i2cnet
  in_channels: 1
  num_classes: 5
  channels: [16, 24, 40, 64, 96]
  relation_weights: [1.0, 2.0, 1.0, 1.0]
loss:
  name: i2cnet_ce
training:
  epochs: 2000
  batch_size: 8
  num_workers: 2
  optimizer: adam
  lr: 0.0001
  weight_decay: 0.00001
  lr_policy: poly
  poly_power: 0.9
  patience: 2000
  monitor: miou_fg
  monitor_mode: max
